name: Prueba de Telegram
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/prueba-telegram.yml"]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de prueba
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOKEN="$(echo -n "$TOKEN" | tr -d '[:space:]')"
          CHAT="$(echo -n "$CHAT" | tr -d '[:space:]')"
          echo "token cargado: $([ -n "$TOKEN" ] && echo si || echo NO)"
          echo "chat cargado: $([ -n "$CHAT" ] && echo si || echo NO)"
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 1
          curl -s "https://api.telegram.org/bot${TOKEN}/getMe" | python3 -c "import json,sys;d=json.load(sys.stdin);print('bot:', d.get('result',{}).get('username') if d.get('ok') else 'ERROR '+str(d.get('description')))"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id="$CHAT" --data-urlencode text="✅ Cazador Hogar conectado. Acá te van a llegar las ofertas de ferretería y hogar." | python3 -c "import json,sys;d=json.load(sys.stdin);print('envio:', 'OK' if d.get('ok') else 'ERROR '+str(d.get('description')))"
